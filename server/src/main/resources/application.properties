spring.application.name=configvault
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/configvault?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:configvault}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=300KB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
